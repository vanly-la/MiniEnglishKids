<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Happy Paws English</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--b1:#ffe27a;--b2:#9fe3ff;--ink:#3b2a63;--card:#fff;--c1:#ff5d8f;--c2:#ff9a2e;--c3:#2fc47a;--c4:#3d9bff;--c5:#9b5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#3a2c6e;--b2:#18385f;--ink:#fff6dc;--card:#4b3d86}}
:root[data-theme="dark"]{--b1:#3a2c6e;--b2:#18385f;--ink:#fff6dc;--card:#4b3d86}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--b2);background:linear-gradient(160deg,var(--b1),var(--b2)) fixed;color:var(--ink);font-family:'Fredoka','Chalkboard SE','Comic Sans MS',system-ui,sans-serif;font-weight:500;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{max-width:900px;margin:0 auto;padding:10px 14px 40px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}.hd b{flex:1;font-size:1.5rem}
.ib{width:52px;height:52px;border-radius:50%;background:var(--card);font-size:1.5rem;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.coin{background:var(--card);border-radius:30px;padding:10px 14px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.hero{text-align:center;margin:8px 0 14px}.hero h1{margin:4px 0;font-size:clamp(1.9rem,7vw,3rem);color:var(--c1);text-shadow:0 3px 0 rgba(255,255,255,.7)}
.mas{font-size:clamp(5rem,22vw,8rem);line-height:1.1;cursor:pointer;display:inline-block;animation:bob 1.6s ease-in-out infinite}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.lg{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.big,.ans{border-radius:28px;padding:18px 10px;font-size:1.3rem;font-weight:700;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.2);transition:transform .1s;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;justify-content:center}
.big span{font-size:2.6rem}.big:active,.ans:active,.lt:active,.card:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}
.ans{font-size:3.2rem;min-height:120px}
.lt{aspect-ratio:1;border-radius:22px;font-size:2.2rem;font-weight:700;color:#fff;background:hsl(var(--h) 80% 55%);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.pg{text-align:center}.sub{font-size:1.2rem;margin:6px 0 12px}
.stage,.q{background:var(--card);border-radius:30px;padding:14px;margin-bottom:14px;box-shadow:0 6px 0 rgba(0,0,0,.15);min-height:150px}
.obj{font-size:5.5rem;line-height:1.1}.bl{font-size:3rem;font-weight:700;color:var(--c5)}
.stage h2,.q h2{margin:4px 0 8px;font-size:2rem}
.bo{animation:boing .7s}
.card{background:var(--card);border-radius:24px;padding:12px 8px;box-shadow:0 5px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:1.2rem}
.card .em{font-size:3.2rem;line-height:1.2}.card small{font-weight:500;font-size:.9rem;opacity:.8}
.lock{opacity:.55}.sel{outline:5px solid var(--c3)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.tabs button{flex:none;border-radius:20px;padding:10px 16px;background:var(--card);font-weight:700;font-size:1.1rem}.tabs .on{background:var(--c5);color:#fff}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:10px}.dots i{width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.2)}.dots .on{background:var(--c3)}
.msg{min-height:1.6em;font-size:1.3rem;margin:14px 0}
.win{animation:boing .7s;outline:6px solid var(--c3)}.no{animation:shake .4s;opacity:.5}
.slot{background:var(--card);border-radius:24px;padding:10px;min-height:150px;box-shadow:0 5px 0 rgba(0,0,0,.15)}.slot .obj{font-size:4rem}.sw{font-size:1.5rem;font-weight:700;min-height:1.8rem;color:var(--c3)}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px;min-height:70px}
.chip{background:var(--c2);color:#fff;border-radius:22px;padding:14px 20px;font-size:1.5rem;font-weight:700;touch-action:none;cursor:grab;user-select:none;box-shadow:0 5px 0 rgba(0,0,0,.2);position:relative}.chip.dr{z-index:5;cursor:grabbing;box-shadow:0 12px 20px rgba(0,0,0,.3)}
.stats{display:flex;gap:10px;justify-content:center;margin-bottom:8px}.stats div{background:var(--card);border-radius:22px;padding:10px 18px;font-size:2rem;display:flex;flex-direction:column}
.bar{height:22px;background:rgba(0,0,0,.18);border-radius:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c3)}
.lst{background:var(--card);border-radius:20px;padding:10px;text-align:left}label{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:20px;padding:12px;margin:10px 0;font-size:1.2rem}
.mg{display:grid;gap:12px;max-width:520px;margin:0 auto}.mc{perspective:600px;aspect-ratio:1;background:none;padding:0}.mc .in{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .4s}.mc.f .in{transform:rotateY(180deg)}.fr,.bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:clamp(2rem,10vw,3.4rem);box-shadow:0 5px 0 rgba(0,0,0,.2)}.fr{background:var(--c5);color:#fff}.bk{background:var(--card);transform:rotateY(180deg)}.mc.ok .bk{outline:5px solid var(--c3)}.bk.w{font-size:clamp(.85rem,3.6vw,1.25rem);font-weight:700;text-align:center;padding:2px;overflow-wrap:anywhere}
.sky{position:relative;height:62vh;min-height:380px;overflow:hidden;border-radius:30px;background:linear-gradient(#9fdcff,#fff);box-shadow:0 6px 0 rgba(0,0,0,.15);margin-top:8px}.bal{position:absolute;bottom:-120px;width:min(17%,110px);aspect-ratio:.82;border-radius:50% 50% 48% 48%;background:var(--c);font-size:clamp(1.8rem,8vw,3rem);display:flex;align-items:center;justify-content:center;box-shadow:inset -8px -8px 0 rgba(0,0,0,.12);animation:rise linear infinite;padding:0}.bal::after{content:'';position:absolute;bottom:-24px;left:50%;width:2px;height:24px;background:rgba(0,0,0,.35)}.bal.pp{background:none;box-shadow:none}.bal.pp::after{display:none}.bal.pp span{animation:pp .5s forwards;font-size:3.5rem}
@keyframes rise{from{bottom:-120px}to{bottom:105%}}@keyframes pp{to{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.bal{bottom:40px!important}}
.sl{display:flex;gap:8px;justify-content:center;margin:8px 0}.sl i{width:clamp(36px,11vw,56px);height:clamp(46px,13vw,66px);border-radius:14px;background:rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:2rem;font-weight:700;color:var(--c3)}.tile{background:var(--c2);color:#fff;border-radius:18px;width:clamp(52px,16vw,72px);height:clamp(60px,18vw,80px);font-size:2rem;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.2)}.tile:disabled{visibility:hidden}
.cf{position:fixed;top:-6vh;font-size:30px;pointer-events:none;z-index:9;animation:fall var(--d) ease-in forwards}
@keyframes fall{to{transform:translate(var(--x),112vh) rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes boing{30%{transform:scale(1.3) rotate(-8deg)}60%{transform:scale(.9) rotate(6deg)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
button:focus-visible{outline:4px solid var(--c4);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),R=a=>a[Math.random()*a.length|0],sh=a=>a.slice().sort(()=>Math.random()-.5);
const DEF={coins:0,stars:{},seen:[],music:true,mv:.5,sv:.8,mascot:0,games:0};
let S={...DEF};try{S={...DEF,...JSON.parse(localStorage.getItem('hpe')||'{}')}}catch(e){}
const save=()=>{try{localStorage.setItem('hpe',JSON.stringify(S))}catch(e){}};
const P=s=>s.split(';').map(x=>{let[a,ex]=x.split('|'),i=a.indexOf(' ');return{e:a.slice(0,i),t:a.slice(i+1),x:ex||''}});
const NW='one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty'.split(' ');
const D={
phrases:P('👋 Hello|Hello! Nice to meet you.;👋 Goodbye|Goodbye! See you soon.;🌅 Good Morning|Good morning, Mom!;🙏 Thank You|Thank you for the apple.;🤲 Please|Apple, please.;😔 Sorry|I am sorry.;😊 How are you?|I am fine, thank you.;🙋 My name is...|My name is Lily.;❓ What is your name?|What is your name?'),
animals:P('🐱 Cat;🐶 Dog;🐼 Panda;🐰 Rabbit;🦖 Dinosaur;🐵 Monkey;🐘 Elephant;🦁 Lion;🐯 Tiger;🐸 Frog;🐟 Fish;🐦 Bird'),
fruits:P('🍎 Apple;🍌 Banana;🍇 Grapes;🍊 Orange;🍓 Strawberry;🍉 Watermelon;🍍 Pineapple;🍐 Pear'),
family:P('👨 Dad;👩 Mom;👴 Grandpa;👵 Grandma;👦 Brother;👧 Sister;👶 Baby'),
body:P('👀 Eyes;👂 Ears;👃 Nose;👄 Mouth;🖐️ Hand;🦶 Foot;🦷 Teeth;🧠 Brain'),
colors:P('🔴 Red;🟡 Yellow;🔵 Blue;🟢 Green;🟠 Orange;🟣 Purple;⚫ Black;⚪ White;🟤 Brown'),
numbers:NW.map((t,i)=>({e:''+(i+1),t,x:'Let’s count to '+(i+1)+'!'}))};
const TL={phrases:'💬 Talk',animals:'🐱 Animals',fruits:'🍎 Fruits',family:'👪 Family',body:'🖐️ Body',numbers:'🔢 Numbers',colors:'🎨 Colors'};
const L='Apple,Ball,Cat,Dog,Elephant,Fish,Grapes,Hat,Ice cream,Juice,Kite,Lion,Monkey,Nose,Orange,Panda,Queen,Rabbit,Sun,Tiger,Umbrella,Violin,Whale,Xylophone,Yo-yo,Zebra'.split(',');
const E=['🍎','⚽','🐱','🐶','🐘','🐟','🍇','🎩','🍦','🧃','🪁','🦁','🐵','👃','🍊','🐼','👸','🐰','☀️','🐯','☂️','🎻','🐳','🎹','🪀','🦓'];
const ch=i=>String.fromCharCode(65+i);
const MS=[{e:'🐱',n:'Kitty',c:0},{e:'🐼',n:'Panda',c:15},{e:'🐰',n:'Bunny',c:40},{e:'🦖',n:'Dino',c:80},{e:'🐵',n:'Momo',c:130}];
const PR=['Great Job!','Excellent!','You’re Amazing!','Super Star!','Keep Learning!'];
/* audio */
let AC,mt,mi=0;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t0,d,ty,v){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(Math.max(v,.001),t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function sfx(n){const v=S.sv*.25,f={click:()=>tone(700,0,.07,'sine',v),good:()=>[523,659,784,1047].forEach((q,i)=>tone(q,i*.09,.25,'triangle',v)),bad:()=>{tone(260,0,.15,'sine',v);tone(200,.14,.25,'sine',v)},win:()=>[523,659,784,659,784,1047,1319].forEach((q,i)=>tone(q,i*.12,.3,'triangle',v))};f[n]&&f[n]()}
const MU=[262,330,392,330,294,349,440,349,262,330,392,523,392,330,294,196];
function startMusic(){if(mt)return;ac();mt=setInterval(()=>{if(!S.music||document.hidden)return;const n=MU[mi++%MU.length];tone(n,0,.35,'triangle',S.mv*.12);if(mi%4==1)tone(n/2,0,.6,'sine',S.mv*.1)},320)}
function togM(){S.music=!S.music;save();startMusic();document.querySelectorAll('.mb').forEach(b=>b.textContent=S.music?'🎵':'🔇')}
function say(t,r,q){try{const ss=speechSynthesis;if(!q)ss.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\.\.\./g,''));u.lang='en-US';u.rate=r||.8;u.pitch=1.15;u.volume=Math.max(.4,S.sv);const vs=ss.getVoices(),v=vs.find(v=>/en[-_]US/.test(v.lang))||vs.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;ss.speak(u)}catch(e){}}
document.addEventListener('pointerdown',startMusic);
document.addEventListener('click',e=>{if(e.target.closest('button'))sfx('click')});
function confetti(n){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='cf';s.textContent=R(['⭐','🎉','✨','🎈','💖','🌟']);s.style.cssText=`left:${Math.random()*100}vw;--d:${1.5+Math.random()}s;--x:${Math.random()*80-40}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}}
const boing=el=>{el.classList.remove('bo');void el.offsetWidth;el.classList.add('bo')};
const hdr=t=>`<div class=hd><button class=ib onclick="go('home')" aria-label="Home">🏠</button><b>${t}</b><span class=coin>🪙 ${S.coins}</span><button class="ib mb" onclick="togM()" aria-label="Music">${S.music?'🎵':'🔇'}</button></div>`;
let cur,Q,LG,M;
function go(n,a){cur=n;try{speechSynthesis.cancel()}catch(e){}const h=V[n](a);if(h)$('#app').innerHTML=h;window.scrollTo(0,0);if(n=='match')matchInit();if(n=='memory')memInit()}
const BD=()=>{const ts=Object.values(S.stars).reduce((a,b)=>a+b,0);return[['🔤','ABC Explorer',S.seen.length>=26],['⭐','Star Collector',ts>=10],['🧩','Match Master',(S.stars.Matching||0)>=3],['🪙','Coin Collector',S.coins>=50],['🎓','Super Learner',S.games>=10]]};
const V={
home(){const m=MS[S.mascot];setTimeout(()=>say('Hello! Let’s play and learn English!'),400);
return `<div class=hero><div class=mas onclick="say('Hello! I am ${m.n}!');boing(this)">${m.e}</div><h1>Happy Paws English</h1></div><div class=grid>${[['abc','🔤','ABC Learning','c1'],['find','🔍','Find the Letter','c2'],['match','🧩','Picture Matching','c3'],['listen','👂','Listen &amp; Learn','c4'],['basic','💬','Basic English','c5'],['numcol','🔢','Numbers &amp; Colors','c2'],['math','➕','Add &amp; Subtract','c3'],['memory','🃏','Memory Games','c5'],['pop','🎈','Balloon Pop','c1'],['spell','✏️','Spell It!','c3'],['missing','🕵️','Find the Missing','c4'],['rewards','🏆','My Rewards','c1']].map(b=>`<button class="big ${b[3]}" onclick="go('${b[0]}')"><span>${b[1]}</span>${b[2]}</button>`).join('')}</div><p><button class="coin" onclick="go('parent')">👪 Parents</button></p>`},
abc(){say('Tap a letter!');return hdr('ABC')+`<div class=pg><div id=st class=stage><div class=obj>🔤</div><h2>Tap a letter!</h2></div><p class=sub id=cnt>${S.seen.length}/26 ⭐</p><div class="grid lg">${[...Array(26)].map((_,i)=>`<button class=lt style="--h:${i*14}" onclick="letter(${i})">${ch(i)}</button>`).join('')}</div></div>`},
find(){quiz('Find the Letter',findMk);return ''},
listen(){const all=[...D.animals,...D.fruits,...D.body];quiz('Listen & Choose',()=>listenMk(all));return ''},
basic(){LG={keys:['phrases','animals','fruits','family','body'],tab:'phrases'};return learn()},
numcol(){LG={keys:['numbers','colors'],tab:'numbers'};return learn()},
math(){setTimeout(()=>say('Let’s do math! Pick a game.'),300);return hdr('Add &amp; Subtract')+`<div class=pg><div class=grid><button class="big c1" onclick="mathGo('add')"><span>➕</span>Plus</button><button class="big c4" onclick="mathGo('sub')"><span>➖</span>Minus</button><button class="big c2" onclick="mathGo('mul')"><span>✖️</span>Times</button><button class="big c5" onclick="mathGo('mix')"><span>🔀</span>Mix</button></div></div>`},
missing(){setTimeout(()=>say('What is missing? Pick a game!'),300);return hdr('Find the Missing')+`<div class=pg><div class=grid><button class='big c1' onclick='missInit()'><span>🔎</span>Pictures</button><button class='big c2' onclick="quiz('Missing Letter',misLetMk)"><span>🔠</span>Letter in Word</button><button class='big c3' onclick="quiz('Missing Number',misNumMk)"><span>🔢</span>Numbers</button><button class='big c5' onclick="quiz('Missing ABC',misAbcMk)"><span>🔡</span>ABC Order</button></div></div>`},
pop(){popInit();return ''},
spell(){spellInit();return ''},
memory(){return hdr('Memory Games')+'<div class=pg id=mm></div>'},
match(){return hdr('Picture Matching')+'<div class=pg id=mt></div>'},
rewards(){const ts=Object.values(S.stars).reduce((a,b)=>a+b,0);return hdr('My Rewards')+`<div class=pg><div class=stats><div>🪙<b>${S.coins}</b></div><div>⭐<b>${ts}</b></div><div>🔤<b>${S.seen.length}/26</b></div></div><h2>Badges</h2><div class=grid>${BD().map(b=>`<div class="card ${b[2]?'':'lock'}"><span class=em>${b[2]?b[0]:'🔒'}</span><b>${b[1]}</b></div>`).join('')}</div><h2>My Friends</h2><div class=grid>${MS.map((m,i)=>S.coins>=m.c?`<button class="card ${i==S.mascot?'sel':''}" onclick="S.mascot=${i};save();go('rewards')"><span class=em>${m.e}</span><b>${m.n}</b></button>`:`<div class="card lock"><span class=em>🔒</span><b>${m.c} 🪙</b></div>`).join('')}</div></div>`},
parent(){const st=Object.entries(S.stars);return hdr('Parents')+`<div class=pg><h2>Learning progress</h2><div class=bar><i style="width:${S.seen.length/26*100}%"></i></div><p>Letters learned: ${S.seen.length} of 26. Games finished: ${S.games}.</p><div class=lst>${st.length?st.map(([k,v])=>`<div>${k}: ${'⭐'.repeat(v)}</div>`).join(''):'<div>No games finished yet.</div>'}</div><h2>Sound</h2><label>🎵 Music <input type=range min=0 max=100 value="${S.mv*100}" oninput="S.mv=this.value/100;save()"></label><label>🔊 Effects &amp; voice <input type=range min=0 max=100 value="${S.sv*100}" oninput="S.sv=this.value/100;save()"></label><button class="big c4" style="width:100%" onclick="togM()">Music on/off</button><p><button class="big c1" style="width:100%" onclick="rst(this)">Reset progress</button></p></div>`}};
function rst(b){if(b.dataset.s){S={...DEF};save();go('home')}else{b.dataset.s=1;b.textContent='Tap again to erase everything'}}
function letter(i){if(!S.seen.includes(i)){S.seen.push(i);save();if(S.seen.length==26){sfx('win');confetti(30)}}$('#cnt').textContent=S.seen.length+'/26 ⭐';$('#st').innerHTML=`<div class=bl>${ch(i)} ${ch(i).toLowerCase()}</div><div class="obj bo">${E[i]}</div><h2>${L[i]}</h2><button class=ib onclick="letter(${i})" aria-label="Hear again">🔊</button>`;say(ch(i),.7);say(L[i],.45,1)}
/* learn */
function learn(){const it=D[LG.tab];return hdr('Learn')+`<div class=pg><div class=tabs>${LG.keys.map(k=>`<button class="${k==LG.tab?'on':''}" onclick="LG.tab='${k}';go2()">${TL[k]}</button>`).join('')}</div><button class="big c3" style="width:100%;margin-bottom:14px" onclick="playCat()"><span>🎮</span>Play the game</button><div class=grid>${it.map((o,i)=>`<button class=card onclick="hear(${i},this)"><span class=em>${o.e}</span><b>${o.t}</b>${o.x?`<small>${o.x}</small>`:''}</button>`).join('')}</div></div>`}
function go2(){$('#app').innerHTML=learn();say('Tap a card!')}
function hear(i,b){const o=D[LG.tab][i];boing(b.firstChild);say(o.t,.7);if(o.x)say(o.x,.75,1)}
function playCat(){const t=LG.tab;quiz('Listen: '+TL[t].slice(3),()=>listenMk(D[t]))}
/* quiz */
function findMk(){return sh([...Array(26).keys()]).slice(0,5).map(i=>{const o=sh([i,...sh([...Array(26).keys()].filter(j=>j!=i)).slice(0,3)]);return{show:E[i],q:`Which letter is ${L[i]}?`,s:`Which letter is ${L[i]}?`,c:o.map(ch),a:o.indexOf(i),h:`Say it slowly: ${L[i]}. What sound do you hear first?`,hs:L[i]}})}
function listenMk(pool){return sh(pool).slice(0,5).map(it=>{const o=sh([it,...sh(pool.filter(p=>p!=it&&p.e!=it.e)).slice(0,2)]);return{q:'Listen! Tap the right picture.',s:it.t,c:o.map(x=>x.e),a:o.indexOf(it),h:'Listen again: '+it.t,hs:it.t}})}
function quiz(title,mk){Q={title,rounds:mk(),i:0,miss:0,ok:0,re:()=>quiz(title,mk)};qshow()}
function qshow(){const r=Q.rounds[Q.i];Q.lock=0;Q.m=0;cur='quiz';$('#app').innerHTML=hdr(Q.title)+`<div class=pg><div class=dots>${Q.rounds.map((_,k)=>`<i class="${k<Q.i?'on':''}"></i>`).join('')}</div><div class=q>${r.show?`<div class="obj bo">${r.show}</div>`:''}<h2>${r.q}</h2><button class=ib onclick="say(Q.rounds[Q.i].s,.6)" aria-label="Hear again">🔊</button></div><div class=grid>${r.c.map((c,k)=>`<button class="ans c${k%5+1}" onclick="pick(${k},this)">${c}</button>`).join('')}</div><p id=msg class=msg></p></div>`;say(r.s,.7)}
function pick(k,b){const r=Q.rounds[Q.i];if(Q.lock||b.disabled)return;if(k==r.a){Q.lock=1;if(!Q.m)Q.ok++;sfx('good');confetti(14);b.classList.add('win');const p=R(PR);$('#msg').textContent='⭐ '+p;say(p,.9);setTimeout(()=>{Q.i++;Q.i>=Q.rounds.length?fin():qshow()},1500)}else{Q.m=1;Q.miss++;sfx('bad');b.disabled=true;b.classList.add('no');$('#msg').textContent='Oops! 😊 '+r.h;say('Try again! '+r.hs,.5)}}
function fin(){const s=Q.miss==0?3:Q.miss<=2?2:1,g=s*3+Q.ok,old=S.coins;S.coins+=g;S.games++;S.stars[Q.title]=Math.max(S.stars[Q.title]||0,s);save();const nw=MS.filter(m=>m.c>old&&m.c<=S.coins);const p=R(PR);cur='fin';$('#app').innerHTML=hdr('Well done!')+`<div class=pg><div class=mas>${MS[S.mascot].e}</div><h1>${p}</h1><div class=obj>${'⭐'.repeat(s)}</div><p class=sub>+${g} 🪙</p>${nw.length?`<p class=sub>🎉 New friend: ${nw.map(m=>m.e+' '+m.n).join(', ')}!</p>`:''}<div class=grid><button class="big c3" onclick="Q.re()"><span>🔁</span>Play again</button><button class="big c4" onclick="go('home')"><span>🏠</span>Home</button></div></div>`;sfx('win');confetti(40);say(p+' You are amazing!',.85)}
/* math */
const MN={add:'Plus ➕',sub:'Minus ➖',mul:'Times ✖️',mix:'Plus & Minus'};
function mathGo(m){quiz(MN[m],()=>mathMk(m))}
function mathMk(m){return[...Array(5)].map(()=>{const x=m=='mul',p=m=='add'||(m=='mix'&&Math.random()<.5),o=R(['🍎','⭐','🐱','🎈','🍓']);let a,b,r;if(x){a=1+Math.random()*5|0;b=1+Math.random()*5|0;r=a*b}else if(p){a=1+Math.random()*6|0;b=1+Math.random()*(10-a)|0;r=a+b}else{a=2+Math.random()*9|0;b=1+Math.random()*(a-1)|0;r=a-b}const c=sh([r,...sh([...new Set([r-2,r-1,r+1,r+2,a+b].filter(z=>z>0&&z!=r))]).slice(0,2)]);if(x)return{show:`<span style="font-size:.45em">${Array(a).fill(o.repeat(b)).join(' ➕ ')}</span>`,q:`${a} × ${b} = ?`,s:`${a} times ${b}. What is the answer?`,c,a:c.indexOf(r),h:'Count all the groups together!',hs:`${a} groups of ${b}. Count them all.`};return{show:`<span style="font-size:.45em">${o.repeat(a)} ${p?'➕':'➖'} ${o.repeat(b)}</span>`,q:`${a} ${p?'+':'−'} ${b} = ?`,s:`${a} ${p?'plus':'minus'} ${b}. What is the answer?`,c,a:c.indexOf(r),h:p?'Count all of them together!':'Count what is left!',hs:p?`Start with ${a}. Now count ${b} more.`:`Start with ${a}. Take away ${b}. Count what is left.`}})}
/* memory */
let F;
function memLevels(w){$('#mm').innerHTML=`<p class=sub>Pick a level!</p><div class=grid><button class='big c3' onclick='memStart(3,${w})'><span>🐣</span>Easy</button><button class='big c4' onclick='memStart(4,${w})'><span>🐥</span>Medium</button><button class='big c1' onclick='memStart(6,${w})'><span>🦄</span>Hard</button></div>`;say('Find the matching pairs! Choose a level.')}
function memInit(){$('#mm').innerHTML=`<p class=sub>Pick a memory game!</p><div class=grid><button class='big c3' onclick='memLevels(0)'><span>🃏</span>Flip Pairs</button><button class='big c1' onclick='memLevels(1)'><span>🔤</span>Word &amp; Picture</button><button class='big c4' onclick='simInit()'><span>🎵</span>Copy the Order</button><button class='big c2' onclick='missInit()'><span>🔎</span>What’s Missing?</button></div>`;say('Pick a memory game!')}
const SA=[['🐱','Cat','c1'],['🐶','Dog','c4'],['🐼','Panda','c3'],['🐰','Rabbit','c5']];let X,Y;
function simInit(){X={seq:[],r:0,miss:0};cur='memory';$('#mm').innerHTML=`<p class=sub id=sm>Watch and remember!</p><div class=grid style='grid-template-columns:repeat(2,1fr);max-width:420px;margin:0 auto'>${SA.map((a,i)=>`<button class='big ${a[2]}' id=sb${i} onclick='simTap(${i})'><span>${a[0]}</span>${a[1]}</button>`).join('')}</div><p id=msg class=msg></p>`;say('Watch and remember the order!');setTimeout(simNext,1500)}
function simNext(){if(cur!='memory'||!X)return;if(++X.r>5){Q={title:'Copy the Order',miss:X.miss<=1?0:X.miss<=3?1:3,ok:5,re:simInit};return fin()}const rn=()=>Math.random()*4|0;X.seq.push(rn());if(X.r==1)X.seq.push(rn());simPlay()}
function simPlay(){const s=X.seq,r=X.r;X.lock=1;X.p=0;$('#sm').textContent=`Round ${r} of 5: Watch! 👀`;$('#msg').textContent='';s.forEach((v,k)=>setTimeout(()=>{if(cur=='memory'&&X.r==r)flash(v)},700+k*850));setTimeout(()=>{if(cur=='memory'&&X.r==r){X.lock=0;$('#sm').textContent='Your turn! 👆'}},700+s.length*850)}
function flash(i){const b=$('#sb'+i);if(!b)return;boing(b);b.classList.add('win');setTimeout(()=>b.classList.remove('win'),500);tone(330+i*110,0,.3,'triangle',S.sv*.3);say(SA[i][1],.9)}
function simTap(i){if(X.lock)return;flash(i);if(i==X.seq[X.p]){if(++X.p==X.seq.length){X.lock=1;sfx('good');confetti(10);$('#msg').textContent='⭐ '+R(PR);setTimeout(simNext,1500)}}else{X.miss++;X.lock=1;sfx('bad');$('#msg').textContent='Oops! Watch again 😊';setTimeout(()=>{if(cur=='memory')simPlay()},1500)}}
const MLV=[[3,6000],[4,5000],[5,4000],[6,3000]];
function missInit(){cur='missing';$('#app').innerHTML=hdr('What’s Missing?')+`<div class=pg><p class=sub>Pick a level!</p><div class=grid><button class='big c3' onclick='missStart(0)'><span>🐣</span>Easy</button><button class='big c4' onclick='missStart(1)'><span>🐥</span>Medium</button><button class='big c1' onclick='missStart(2)'><span>🦄</span>Hard</button><button class='big c5' onclick='missStart(3)'><span>🚀</span>Super</button></div></div>`;say('Pick a level!')}
function missStart(l){Y={r:0,miss:0,l};missNext()}
function missNext(){if(++Y.r>5){Q={title:'What’s Missing L'+(Y.l+1),miss:Y.miss<=1?0:Y.miss<=3?1:3,ok:5,re:missInit};return fin()}const n=MLV[Y.l][0],it=sh([...D.animals,...D.fruits]).slice(0,n+2),show=it.slice(0,n),g=Math.random()*n|0,o=sh([show[g],...it.slice(n)]),r=Y.r;Y.it=show;Y.g=g;Y.o=o;Y.a=o.indexOf(show[g]);cur='memory';$('#app').innerHTML=hdr('What’s Missing?')+`<div class=pg><div class=q><div class=obj id=mo style='font-size:${n>3?'3.6rem':'5.5rem'}'>${show.map(x=>x.e).join(' ')}</div><h2 id=mh>Remember them! 👀</h2></div><div id=mc class=grid></div><p id=msg class=msg></p></div>`;say('Remember the pictures!');setTimeout(()=>{if(cur=='memory'&&Y.r==r)missAsk()},MLV[Y.l][1])}
function missAsk(){const mo=$('#mo');if(!mo)return;mo.textContent=Y.it.map((x,i)=>i==Y.g?'❓':x.e).join(' ');$('#mh').textContent='What’s missing?';$('#mc').innerHTML=Y.o.map((x,k)=>`<button class='ans c${k%5+1}' onclick='missPick(${k},this)'>${x.e}</button>`).join('');say('What is missing?')}
function missPick(k,b){if(b.disabled)return;if(k==Y.a){document.querySelectorAll('#mc button').forEach(x=>x.disabled=true);sfx('good');confetti(14);b.classList.add('win');const p=R(PR);$('#msg').textContent='⭐ '+p;say(p,.9);setTimeout(missNext,1500)}else{Y.miss++;sfx('bad');b.disabled=true;b.classList.add('no');$('#msg').textContent='Oops! 😊 Try again!';say('Try again!')}}
function memStart(n,w){const it=sh([...D.animals,...D.fruits]).slice(0,n);F={n,miss:0,left:n,open:[],lock:0,c:sh(w?it.flatMap(o=>[{e:o.e,t:o.t},{e:o.t,t:o.t,w:1}]):[...it,...it].map(o=>({e:o.e,t:o.t})))};$('#mm').innerHTML=`<p class=sub>Flip two cards. Remember where they are!</p><div class=mg style='grid-template-columns:repeat(${n==3?3:4},1fr)'>${F.c.map((o,i)=>`<button class=mc onclick='flip(${i},this)' aria-label='Card'><div class=in><div class=fr>❓</div><div class='bk${o.w?' w':''}'>${o.e}</div></div></button>`).join('')}</div><p id=msg class=msg></p>`;say('Flip two cards and find the pairs!')}
function flip(i,b){const c=F.c[i],M2=t=>{const m=$('#msg');if(m)m.textContent=t};if(F.lock||c.f)return;c.f=1;b.classList.add('f');say(c.t,.7);F.open.push([i,b]);if(F.open.length<2)return;F.lock=1;const[x,y]=F.open;if(F.c[x[0]].t==F.c[y[0]].t){sfx('good');confetti(8);x[1].classList.add('ok');y[1].classList.add('ok');F.open=[];F.lock=0;M2('⭐ '+R(PR));if(--F.left==0)setTimeout(()=>{Q={title:'Memory Flip',miss:F.miss<=F.n?0:F.miss<=2*F.n?1:3,ok:F.n,re:()=>go('memory')};fin()},1300)}else{F.miss++;sfx('bad');M2('Oops! Try again 😊');setTimeout(()=>{[x,y].forEach(z=>{F.c[z[0]].f=0;z[1].classList.remove('f')});F.open=[];F.lock=0;M2('')},1000)}}
/* pop & spell */
let Z,W;
function popInit(){Z={r:0,miss:0};popNext()}
function popSay(){say('Pop the '+Z.t.t+'!',.7)}
function popNext(){if(++Z.r>8){Q={title:'Balloon Pop',miss:Z.miss<=1?0:Z.miss<=3?1:3,ok:8,re:popInit};return fin()}const it=sh([...D.animals,...D.fruits,...D.body,...D.numbers.slice(0,10)]),t=it[0],o=sh(it.slice(0,5));Z.t=t;Z.o=o;cur='pop';$('#app').innerHTML=hdr('Balloon Pop')+`<div class=pg><h2>🎈 Pop the ${t.t}! <button class=ib onclick='popSay()' aria-label='Hear again'>🔊</button></h2><div class=sky>${o.map((x,i)=>`<button class=bal style='left:${3+i*19}%;--c:hsl(${i*70+10} 85% 60%);animation-duration:${6+i%3*1.5}s;animation-delay:${-i*1.3}s' onclick='popTap(${i},this)'><span>${x.e}</span></button>`).join('')}</div><p id=msg class=msg></p></div>`;say('Pop the '+t.t+'!',.7)}
function popTap(k,b){if(b.dataset.d)return;const x=Z.o[k];if(x==Z.t){document.querySelectorAll('.bal').forEach(e=>{e.dataset.d=1;e.style.animationPlayState='paused'});b.firstChild.textContent='💥';b.classList.add('pp');sfx('good');confetti(12);const p=R(PR);$('#msg').textContent='⭐ '+p;say(p,.9);setTimeout(popNext,1500)}else{Z.miss++;boing(b.firstChild);sfx('bad');$('#msg').textContent='Oops! 😊 That is '+x.t+'. Find the '+Z.t.t+'!';say('That is '+x.t+'. Find the '+Z.t.t+'!',.7)}}
function spellInit(){W={r:0,miss:0};spellNext()}
function spellNext(){if(++W.r>5){Q={title:'Spell It',miss:W.miss<=2?0:W.miss<=5?1:3,ok:5,re:spellInit};return fin()}const pl=[...D.animals,...D.fruits].filter(x=>x.t.length<=6&&x.t.indexOf(' ')<0),o=R(pl);W.w=o.t.toUpperCase();W.p=0;cur='spell';$('#app').innerHTML=hdr('Spell It!')+`<div class=pg><div class=q><div class='obj bo'>${o.e}</div><div class=sl id=sl>${[...W.w].map(()=>'<i></i>').join('')}</div><button class=ib onclick='say(W.w.toLowerCase(),.5)' aria-label='Hear again'>🔊</button></div><div class=chips>${sh([...W.w]).map(c=>`<button class=tile onclick='spellTap(this)'>${c}</button>`).join('')}</div><p id=msg class=msg></p></div>`;say('Spell '+o.t+'!',.6)}
function spellTap(b){const c=b.textContent;if(c==W.w[W.p]){$('#sl').children[W.p].textContent=c;W.p++;b.disabled=true;say(c.toLowerCase(),.7);if(W.p==W.w.length){sfx('good');confetti(14);const p=R(PR);$('#msg').textContent='⭐ '+p;say(W.w.toLowerCase(),.5);say(p,.9,1);setTimeout(spellNext,2400)}}else{W.miss++;boing(b);sfx('bad');$('#msg').textContent='Oops! 😊 Try another letter.'}}
/* missing games */
const AB='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function misLetMk(){const pl=[...D.animals,...D.fruits].filter(x=>x.t.length>2&&x.t.indexOf(' ')<0);return sh(pl).slice(0,5).map(o=>{const w=o.t.toUpperCase(),i=Math.random()*w.length|0,m=w[i],c=sh([m,...sh([...AB].filter(z=>z!=m)).slice(0,3)]);return{show:`${o.e}<div style="font-size:.5em;letter-spacing:.15em;font-weight:700">${[...w].map((z,k)=>k==i?'_':z).join(' ')}</div>`,q:'Which letter is missing?',s:`${o.t}. Which letter is missing?`,c,a:c.indexOf(m),h:`Say it slowly: ${o.t}.`,hs:o.t}})}
function misNumMk(){return[...Array(5)].map((_,r)=>{const st=r>2?2:1,s0=st==2?2*(1+Math.random()*5|0):1+Math.random()*15|0,seq=[0,1,2,3,4].map(k=>s0+k*st),i=1+Math.random()*3|0,m=seq[i],c=sh([m,...sh([...Array(20).keys()].map(z=>z+1).filter(z=>!seq.includes(z))).slice(0,2)]);return{show:`<span style="font-size:.6em;font-weight:700">${seq.map((z,k)=>k==i?'❓':z).join(' ')}</span>`,q:'Which number is missing?',s:`${st==2?'Count by twos. ':'Count with me. '}${seq.map((z,k)=>k==i?'blank':z).join(', ')}. Which number is missing?`,c,a:c.indexOf(m),h:st==2?'Count by twos: 2, 4, 6...':'Count slowly from the start.',hs:st==2?'Count by twos.':'Count slowly from the start.'}})}
function misAbcMk(){return[...Array(5)].map(()=>{const s0=Math.random()*21|0,seq=[0,1,2,3,4].map(k=>AB[s0+k]),i=1+Math.random()*3|0,m=seq[i],c=sh([m,...sh([...AB].filter(z=>!seq.includes(z))).slice(0,3)]);return{show:`<span style="font-size:.6em;font-weight:700">${seq.map((z,k)=>k==i?'_':z).join(' ')}</span>`,q:'Which letter is missing?',s:`${seq.map((z,k)=>k==i?'blank':z).join(', ')}. Which letter is missing?`,c,a:c.indexOf(m),h:'Sing the ABC song slowly!',hs:'Sing the ABC song slowly.'}})}
/* matching */
function matchInit(){const it=sh(D[R(['animals','fruits','colors','body'])]).slice(0,4);M={miss:0,left:4};$('#mt').innerHTML=`<p class=sub>Drag each word to its picture!</p><div class=grid>${it.map(o=>`<div class=slot data-t="${o.t}"><div class=obj>${o.e}</div><div class=sw></div></div>`).join('')}</div><div class=chips>${sh(it).map(o=>`<div class=chip data-t="${o.t}">${o.t}</div>`).join('')}</div><p id=msg class=msg></p>`;say('Drag each word to its picture!');document.querySelectorAll('.chip').forEach(drag)}
function drag(c){let sx,sy,on=0;c.onpointerdown=e=>{on=1;sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId);c.classList.add('dr');say(c.dataset.t,.7)};c.onpointermove=e=>{if(on)c.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px)`};c.onpointerup=e=>{if(!on)return;on=0;c.classList.remove('dr');c.style.transform='';const s=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('slot'));if(!s||s.classList.contains('win'))return;if(s.dataset.t==c.dataset.t){s.querySelector('.sw').textContent=c.dataset.t;s.classList.add('win');c.remove();sfx('good');confetti(8);say(c.dataset.t,.7);if(--M.left==0)setTimeout(()=>{Q={title:'Matching',miss:M.miss,ok:Math.max(0,4-M.miss),re:()=>go('match')};fin()},1200)}else{M.miss++;sfx('bad');$('#msg').textContent='Oops! 😊 Try another picture.';say('Try again!')}}}
go('home');
</script></body></html>
